<!DOCTYPE html>
<html lang="az" class="dark">
<head>
  <!-- Favicon & Brand Crest -->
  <link rel="icon" type="image/png" href="assets/tdv-logo.png">
  <link rel="apple-touch-icon" href="assets/tdv-logo.png">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TDV Snake (Kiber İlan) | Premium Minigame</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #030303;
      color: white;
      margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
      background: radial-gradient(circle at center, #1e3a8a 0%, #030303 100%);
      overflow: hidden;
    }

    h1 {
      font-size: 3rem; font-weight: 900; letter-spacing: -0.05em;
      background: linear-gradient(to right, #3b82f6, #06b6d4);
      -webkit-background-clip: text; color: transparent;
      margin-bottom: 5px;
    }
    
    .status-badge {
      padding: 6px 20px; border-radius: 20px;
      font-size: 1.2rem; font-weight: 800;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    
    .board-container {
      perspective: 1000px;
      position: relative;
    }

    #game-canvas {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      border: 2px solid rgba(59, 130, 246, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(59, 130, 246, 0.2);
      transform: rotateX(15deg);
      transition: transform 0.3s ease;
    }
    
    #game-canvas:hover {
      transform: rotateX(5deg);
      border-color: rgba(59, 130, 246, 0.8);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(59, 130, 246, 0.4);
    }
    
    .game-over-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 12px;
      transform: rotateX(15deg);
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease;
    }
    
    .game-over-overlay.active {
      opacity: 1; pointer-events: all;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 60px);
      gap: 10px;
      margin-top: 30px;
    }
    
    .controls button {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px;
      color: #60a5fa; font-size: 1.5rem;
      box-shadow: inset 0 0 10px rgba(59, 130, 246, 0.1);
      transition: all 0.1s;
    }
    .controls button:active {
      background: rgba(59, 130, 246, 0.4);
      transform: scale(0.9);
    }
    
    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }

    @media (min-width: 768px) {
      .controls { display: none; } /* Hide on desktop where keyboard is used */
    }
  </style>
</head>
<body>
  
  <a href="index.html" class="absolute top-6 left-6 text-zinc-400 hover:text-white transition font-bold text-sm tracking-widest uppercase z-50">
    ← Ana Səhifəyə Qayıt
  </a>

  <h1>NEON SNAKE</h1>
  <div class="status-badge" id="score-display">Xal: 0</div>

  <div class="board-container">
    <canvas id="game-canvas" width="400" height="400"></canvas>
    
    <div class="game-over-overlay" id="game-over">
      <h2 class="text-3xl font-black text-red-500 mb-2 drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]">OYUN BİTDİ!</h2>
      <p class="text-zinc-300 mb-6 font-bold">Yekun Xal: <span id="final-score" class="text-white text-xl">0</span></p>
      <button onclick="resetGame()" class="px-8 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold transition shadow-[0_0_15px_rgba(37,99,235,0.5)]">Yenidən Başla</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn-up" onclick="setDirection(0, -1)">▲</button>
    <button class="btn-left" onclick="setDirection(-1, 0)">◄</button>
    <button class="btn-down" onclick="setDirection(0, 1)">▼</button>
    <button class="btn-right" onclick="setDirection(1, 0)">►</button>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;
    
    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let gameLoop;
    let isGameOver = false;
    let speed = 100;
    let particles = [];
    
    // SFX
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContextClass();
    
    function playEatSound() {
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }
    
    function playCrashSound() {
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 10, y: 11 },
        { x: 10, y: 12 }
      ];
      dx = 0; dy = -1;
      score = 0;
      speed = 120;
      isGameOver = false;
      particles = [];
      spawnFood();
      updateScore();
      document.getElementById('game-over').classList.remove('active');
      
      if(gameLoop) clearTimeout(gameLoop);
      tick();
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * TILE_COUNT),
        y: Math.floor(Math.random() * TILE_COUNT)
      };
      // Make sure food is not on snake
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) {
          spawnFood();
          break;
        }
      }
    }
    
    function createParticles(x, y, color) {
      for(let i=0; i<10; i++) {
        particles.push({
          x: x * GRID_SIZE + GRID_SIZE/2,
          y: y * GRID_SIZE + GRID_SIZE/2,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          life: 1,
          color: color
        });
      }
    }

    function update() {
      if (isGameOver) return;
      
      // Calculate new head
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      
      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }
      
      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
          return;
        }
      }
      
      snake.unshift(head); // Add new head
      
      // Food collision
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        speed = Math.max(50, speed - 2); // speed up slightly
        updateScore();
        playEatSound();
        createParticles(food.x, food.y, '#facc15'); // Yellow particles
        spawnFood();
      } else {
        snake.pop(); // Remove tail if didn't eat
      }
      
      // Update particles
      for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.05;
        if(p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      // Clear background
      ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw Grid lines (Cyberpunk style)
      ctx.strokeStyle = 'rgba(59, 130, 246, 0.1)';
      ctx.lineWidth = 1;
      for(let i = 0; i <= canvas.width; i += GRID_SIZE) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }
      
      // Draw particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
      
      // Draw snake
      snake.forEach((segment, index) => {
        // Gradient color from Head to Tail
        const r = 59;
        const g = 130 + (index * 2);
        const b = 246;
        
        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.shadowBlur = index === 0 ? 15 : 5; // Head glows more
        ctx.shadowColor = `rgba(${r}, ${g}, ${b}, 0.8)`;
        
        ctx.fillRect(segment.x * GRID_SIZE + 1, segment.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      });
      ctx.shadowBlur = 0; // reset
      
      // Draw food
      ctx.fillStyle = '#facc15';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#facc15';
      
      // Pulsing food
      const pulse = Math.abs(Math.sin(Date.now() / 200)) * 2;
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 2 + pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    
    function tick() {
      update();
      draw();
      if (!isGameOver) {
        gameLoop = setTimeout(tick, speed);
      }
    }
    
    function gameOver() {
      isGameOver = true;
      playCrashSound();
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over').classList.add('active');
    }

    function updateScore() {
      document.getElementById('score-display').innerText = `Xal: ${score}`;
    }

    function resetGame() {
      initGame();
    }
    
    function setDirection(newDx, newDy) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      // Prevent reversing
      if (dx !== 0 && newDx !== 0) return;
      if (dy !== 0 && newDy !== 0) return;
      dx = newDx; dy = newDy;
    }

    document.addEventListener('keydown', (e) => {
      switch(e.key) {
        case 'ArrowUp': case 'w': setDirection(0, -1); break;
        case 'ArrowDown': case 's': setDirection(0, 1); break;
        case 'ArrowLeft': case 'a': setDirection(-1, 0); break;
        case 'ArrowRight': case 'd': setDirection(1, 0); break;
      }
    });

    // Don't auto-start until first click to allow AudioContext
    draw();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '20px Inter';
    ctx.textAlign = 'center';
    ctx.fillText('BAŞLAMAQ ÜÇÜN KLİKLƏ VƏ YA OX DÜYMƏSİNİ BAS', canvas.width/2, canvas.height/2);
    
    let started = false;
    document.addEventListener('keydown', () => { if(!started){ started=true; initGame(); } }, {once:true});
    canvas.addEventListener('click', () => { if(!started){ started=true; initGame(); } });
  </script>
</body>
</html>
