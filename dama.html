<!DOCTYPE html>
<html lang="az" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TDV Dama (Checkers) | Premium Minigame</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #030303;
      color: white;
      margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
      background: radial-gradient(circle at center, #1a0b2e 0%, #030303 100%);
    }
    
    .board-container {
      perspective: 1200px;
      margin: 20px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 400px; height: 400px;
      border: 8px solid #3b0764;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(168,85,247,0.3);
      transform: rotateX(25deg);
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }
    
    @media (max-width: 500px) {
      .board { width: 320px; height: 320px; }
    }

    .cell {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      box-sizing: border-box; position: relative;
    }
    .cell.dark { background-color: #1e1e24; }
    .cell.light { background-color: #e5e5e5; }
    
    .cell.highlight {
      box-shadow: inset 0 0 20px rgba(168, 85, 247, 0.8);
      background-color: rgba(168, 85, 247, 0.3) !important;
      cursor: pointer;
    }
    
    .piece {
      width: 80%; height: 80%;
      border-radius: 50%;
      box-shadow: inset 0 -4px 8px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.5);
      position: absolute;
      transform: translateZ(10px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }
    
    .piece.red {
      background: radial-gradient(circle at 30% 30%, #ef4444, #991b1b);
      border: 2px solid #7f1d1d;
    }
    .piece.white {
      background: radial-gradient(circle at 30% 30%, #f4f4f5, #a1a1aa);
      border: 2px solid #71717a;
    }
    .piece.king::after {
      content: '👑';
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 1.2rem;
    }
    
    .piece.selected {
      transform: translateZ(20px) scale(1.1);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    h1 {
      font-size: 2.5rem; font-weight: 900; letter-spacing: -0.05em;
      background: linear-gradient(to right, #a855f7, #ec4899);
      -webkit-background-clip: text; color: transparent;
      margin-bottom: 5px;
    }
    
    .status-badge {
      padding: 6px 16px; border-radius: 20px;
      font-size: 0.875rem; font-weight: 700;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  
  <a href="index.html" class="absolute top-6 left-6 text-zinc-400 hover:text-white transition font-bold text-sm tracking-widest uppercase">
    ← Ana Səhifəyə Qayıt
  </a>

  <h1>TDV DAMA</h1>
  <div class="status-badge" id="status-display">Qırmızı (Sən) başlayır!</div>

  <div class="board-container">
    <div class="board" id="board"></div>
  </div>

  <div class="flex gap-4 mt-8">
    <button onclick="resetGame()" class="px-6 py-2 rounded-full bg-zinc-800 hover:bg-zinc-700 font-bold transition">Yenidən Başla</button>
  </div>

  <script>
    const BOARD_SIZE = 8;
    let board = [];
    let currentPlayer = 'red';
    let selectedPiece = null;
    let validMoves = [];
    
    // SFX
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContextClass();
    
    function playMoveSound() {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(400, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.1);
    }
    function playCaptureSound() {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(150, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.2);
    }

    function initBoard() {
      board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if ((r + c) % 2 === 1) {
            if (r < 3) board[r][c] = { player: 'white', king: false };
            else if (r > 4) board[r][c] = { player: 'red', king: false };
          }
        }
      }
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = `cell ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
          cell.dataset.r = r; cell.dataset.c = c;
          
          if (validMoves.some(m => m.r === r && m.c === c)) {
            cell.classList.add('highlight');
            cell.onclick = () => moveTo(r, c);
          }
          
          const piece = board[r][c];
          if (piece) {
            const pEl = document.createElement('div');
            pEl.className = `piece ${piece.player} ${piece.king ? 'king' : ''}`;
            if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
              pEl.classList.add('selected');
            }
            if (piece.player === currentPlayer) {
              pEl.onclick = (e) => { e.stopPropagation(); selectPiece(r, c); };
            }
            cell.appendChild(pEl);
          }
          
          boardEl.appendChild(cell);
        }
      }
      
      document.getElementById('status-display').innerText = currentPlayer === 'red' ? '🔴 Qırmızı-nın gedişidir' : '⚪ Ağ-ın gedişidir';
      document.getElementById('status-display').style.color = currentPlayer === 'red' ? '#ef4444' : '#f4f4f5';
    }

    function selectPiece(r, c) {
      selectedPiece = { r, c };
      validMoves = calculateValidMoves(r, c);
      renderBoard();
    }

    function calculateValidMoves(r, c) {
      const piece = board[r][c];
      const moves = [];
      const dirs = piece.king ? [[1,1],[1,-1],[-1,1],[-1,-1]] : piece.player === 'red' ? [[-1,1],[-1,-1]] : [[1,1],[1,-1]];
      
      for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
          if (!board[nr][nc]) {
            moves.push({ r: nr, c: nc, capture: null });
          } else if (board[nr][nc].player !== piece.player) {
            const jmpR = nr + dr, jmpC = nc + dc;
            if (jmpR >= 0 && jmpR < BOARD_SIZE && jmpC >= 0 && jmpC < BOARD_SIZE && !board[jmpR][jmpC]) {
              moves.push({ r: jmpR, c: jmpC, capture: { r: nr, c: nc } });
            }
          }
        }
      }
      return moves;
    }

    function moveTo(r, c) {
      const move = validMoves.find(m => m.r === r && m.c === c);
      if (!move) return;
      
      const piece = board[selectedPiece.r][selectedPiece.c];
      board[r][c] = piece;
      board[selectedPiece.r][selectedPiece.c] = null;
      
      if (move.capture) {
        board[move.capture.r][move.capture.c] = null;
        playCaptureSound();
      } else {
        playMoveSound();
      }
      
      // King promotion
      if (piece.player === 'red' && r === 0) piece.king = true;
      if (piece.player === 'white' && r === BOARD_SIZE - 1) piece.king = true;
      
      selectedPiece = null;
      validMoves = [];
      currentPlayer = currentPlayer === 'red' ? 'white' : 'red';
      renderBoard();
    }

    function resetGame() {
      initBoard();
      currentPlayer = 'red';
      selectedPiece = null;
      validMoves = [];
      renderBoard();
    }

    initBoard();
    renderBoard();
  </script>
</body>
</html>
